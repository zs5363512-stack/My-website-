<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CardVault Demo</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#080b16;
    color:#fff;
}

header{
    background:#0d1120;
    border-bottom:1px solid #242b42;
    padding:20px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

nav a{
    color:#b9c0d8;
    text-decoration:none;
    margin-left:20px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:45px 20px;
}

.hero{
    text-align:center;
    margin-bottom:35px;
}

.hero h1{
    font-size:42px;
    margin:0 0 10px;
}

.hero p{
    color:#929bb5;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:30px;
}

.stat,.card{
    background:#111627;
    border:1px solid #242b42;
    border-radius:15px;
    padding:20px;
}

.stat h2{
    margin:0 0 8px;
}

.stat p{
    color:#929bb5;
    margin:0;
}

.toolbar{
    display:flex;
    gap:10px;
    margin-bottom:25px;
}

input,select{
    padding:13px;
    border-radius:10px;
    border:1px solid #2a324b;
    background:#0b0f1c;
    color:#fff;
}

.toolbar input{
    flex:1;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.badge{
    background:#282f4b;
    color:#c4caff;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
}

.card h3{
    margin-top:20px;
}

.card p{
    color:#9da6c0;
}

.price{
    font-size:22px;
    font-weight:bold;
    margin-top:15px;
}

.buy{
    width:100%;
    margin-top:15px;
    padding:12px;
    border:0;
    border-radius:10px;
    background:#6d5dfc;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

/* PHOTO POPUP */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:10;
}

.modal-box{
    position:relative;
    background:#111627;
    border:1px solid #343c58;
    border-radius:16px;
    padding:20px;
    max-width:500px;
    width:100%;
    text-align:center;
}

.modal-box img{
    max-width:100%;
    max-height:60vh;
    border-radius:10px;
    object-fit:contain;
}

.close{
    position:absolute;
    right:12px;
    top:8px;
    background:none;
    border:0;
    color:#fff;
    font-size:28px;
    cursor:pointer;
}

@media(max-width:750px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .cards{
        grid-template-columns:1fr;
    }

    .hero h1{
        font-size:34px;
    }
}
</style>
</head>

<body>

<header>

<div class="logo">
CardVault <small>Demo</small>
</div>

<nav>
<a href="index.html">Home</a>
<a href="admin.html">Admin</a>
</nav>

</header>


<div class="container">

<section class="hero">

<h1>Card Catalog</h1>

<p>Browse our demo catalog items.</p>

</section>


<section class="stats">

<div class="stat">
<h2 id="total">0</h2>
<p>Total Items</p>
</div>

<div class="stat">
<h2 id="premium">0</h2>
<p>Premium</p>
</div>

<div class="stat">
<h2 id="vip">0</h2>
<p>VIP</p>
</div>

<div class="stat">
<h2 id="avg">₹0</h2>
<p>Average Price</p>
</div>

</section>


<div class="toolbar">

<input
id="search"
placeholder="Search demo items..."
>

<select id="filter">

<option value="All">All</option>
<option value="Standard">Standard</option>
<option value="Premium">Premium</option>
<option value="VIP">VIP</option>

</select>

</div>


<section
class="cards"
id="cards">
</section>

</div>


<!-- PHOTO POPUP -->

<div
class="modal"
id="photoModal">

<div class="modal-box">

<button
class="close"
onclick="closeModal()">
×
</button>

<h2 id="modalTitle">
Item Photo
</h2>

<img
id="modalImage"
alt="Item photo"
>

</div>

</div>


<script>

const KEY =
"cardvault_demo_items_v2";


const defaultImage =
"data:image/svg+xml;charset=UTF-8," +
encodeURIComponent(`

<svg
xmlns="http://www.w3.org/2000/svg"
width="800"
height="500">

<rect
width="100%"
height="100%"
fill="#171d31"/>

<text
x="50%"
y="50%"
fill="#9da6c0"
font-size="34"
text-anchor="middle"
dominant-baseline="middle">

Demo Photo

</text>

</svg>

`);


const seed = [

{
id:1,
name:"Demo Standard Item",
category:"Standard",
price:499,
description:"A sample catalog item for demonstration.",
image:defaultImage
},

{
id:2,
name:"Demo Premium Item",
category:"Premium",
price:999,
description:"A premium demo listing with extra features.",
image:defaultImage
},

{
id:3,
name:"Demo VIP Item",
category:"VIP",
price:1999,
description:"A VIP demo listing for testing the catalog.",
image:defaultImage
}

];


function getItems(){

try{

let data =
JSON.parse(
localStorage.getItem(KEY)
);

return Array.isArray(data)
? data
: seed;

}

catch(error){

return seed;

}

}


function esc(text){

return String(text ?? "")
.replace(/[&<>"']/g,function(c){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[c];

});

}


function render(){

let items =
getItems();

let search =
document
.getElementById("search")
.value
.toLowerCase();

let filter =
document
.getElementById("filter")
.value;


let shown =
items.filter(function(item){

return (

filter === "All"
||
item.category === filter

)

&&

(

item.name
.toLowerCase()
.includes(search)

||
item.description
.toLowerCase()
.includes(search)

);

});


document.getElementById("total")
.textContent =
items.length;


document.getElementById("premium")
.textContent =
items.filter(
x => x.category === "Premium"
).length;


document.getElementById("vip")
.textContent =
items.filter(
x => x.category === "VIP"
).length;


let avg =
items.length

?

Math.round(

items.reduce(
(a,x) =>
a + Number(x.price || 0),
0
)

/

items.length

)

:0;


document.getElementById("avg")
.textContent =
"₹" +
avg.toLocaleString("en-IN");


document.getElementById("cards")
.innerHTML =

shown.length

?

shown.map(function(item){

return `

<article class="card">

<span class="badge">

${esc(item.category)}

</span>

<h3>
${esc(item.name)}
</h3>

<p>
${esc(item.description)}
</p>

<div class="price">

₹${Number(item.price)
.toLocaleString("en-IN")}

</div>

<button
class="buy"
onclick="openModal(${item.id})">

Buy Now

</button>

</article>

`;

}).join("")

:

"<p>No items found.</p>";

}


function openModal(id){

let item =
getItems()
.find(
x => x.id === id
);


if(!item){

return;

}


document
.getElementById("modalTitle")
.textContent =
item.name;


document
.getElementById("modalImage")
.src =
item.image ||
defaultImage;


document
.getElementById("photoModal")
.style.display =
"flex";

}


function closeModal(){

document
.getElementById("photoModal")
.style.display =
"none";

}


document
.getElementById("search")
.addEventListener(
"input",
render
);


document
.getElementById("filter")
.addEventListener(
"change",
render
);


document
.getElementById("photoModal")
.addEventListener(
"click",
function(event){

if(
event.target.id ===
"photoModal"
){

closeModal();

}

}
);


render();

</script>

</body>
</html>
